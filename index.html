<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; worker-src 'self' blob:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' blob: data: ws://127.0.0.1:* ws://localhost:*" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101c20" />
    <title>Lantern</title>
  </head>
  <body>
    <div id="app">
      <div id="scene" aria-label="Game"></div>
      <div id="player-health" class="resource-orb resource-orb--health" role="meter" aria-label="Health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" title="Health · 100 / 100">
        <img class="orb-frame" src="/assets/ui/orbs/health-frame.png" alt="" />
        <div class="orb-vessel"><div class="orb-liquid"><div class="orb-surface"></div><div class="orb-current"></div></div></div>
        <img class="orb-glass" src="/assets/ui/orbs/health-frame.png" alt="" />
      </div>
      <div id="player-mana" class="resource-orb resource-orb--mana" role="meter" aria-label="Mana" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" title="Mana · 100 / 100">
        <img class="orb-frame" src="/assets/ui/orbs/mana-frame.png" alt="" />
        <div class="orb-vessel"><div class="orb-liquid"><div class="orb-surface"></div><div class="orb-current"></div></div></div>
        <img class="orb-glass" src="/assets/ui/orbs/mana-frame.png" alt="" />
      </div>
      <div id="enemy-health" class="enemy-health" role="meter" aria-label="Enemy health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" hidden><div></div></div>
      <p id="asset-status" role="status"></p>
      <div id="result-panel" class="result-panel" hidden><h2 id="result-title"></h2><p id="result-copy"></p><button id="retry" type="button">Return Home</button></div>
      <p id="interaction-prompt" role="status"></p>
      <dialog id="inventory-dialog" class="game-menu" aria-labelledby="inventory-title">
        <header><h2 id="inventory-title">Inventory</h2><button type="button" data-close>Close</button></header>
        <div class="inventory-layout"><section class="equipment-column"><div class="equipment-slots">
          <div class="equipment-slot" data-equipment-slot="main"><span>Main hand</span><div id="equipment-main"></div></div>
          <div class="equipment-slot" data-equipment-slot="off"><span>Off hand</span><div id="equipment-off"></div></div>
        </div>
        <div class="shared-equipment"></div></section><section class="inventory-main"><div id="loadout-stats"></div>
        <div class="inventory-containers"><section><div class="bag-toolbar"><span>Bag</span><button id="inventory-sort" type="button">Sort</button></div>
        <div id="inventory-grid" aria-label="Bag"><div id="inventory-placement" hidden></div></div></section><section id="stash-section" hidden><div class="bag-toolbar"><span>Stash</span><button id="stash-sort" type="button">Sort</button></div><div id="stash-grid" aria-label="Stash"></div></section></div>
        <div id="inventory-overflow" hidden></div>
        </section><aside class="item-details"><h3 id="inventory-selection"></h3><div id="inventory-item-stats"></div><div id="inventory-comparison"></div><div class="item-selection"><button id="inventory-equip" type="button" hidden>Equip</button><button id="inventory-remove" type="button" hidden>Unequip</button><button id="inventory-recover" type="button" hidden>Collect</button><button id="inventory-transfer" type="button" hidden>Store</button><button id="inventory-split" type="button" hidden>Split</button></div>
        </aside></div>
        <p id="equipment-error" role="status"></p>
        <div class="inventory-resources"><div><span>Woodcutting</span><strong id="woodcutting-xp">0 XP</strong></div><div><span>Mining</span><strong id="mining-xp">Lv 1</strong></div><div><span>Axe Combat</span><strong id="axe-combat-xp">0 XP</strong></div></div>
        <p id="rested-status" hidden></p>
        <div class="inventory-item"><span>Scroll of Return</span><span id="scroll-count"></span><button id="scroll-use" type="button">Use</button></div>
        <div id="stack-split" hidden><label>Split stack<input id="split-amount" type="number" min="1" step="1"></label><button id="split-confirm" type="button">Split</button><button id="split-cancel" type="button">Cancel</button></div>
        <div id="inventory-ghost" class="bag-item" hidden></div>
      </dialog>
      <dialog id="repair-dialog" class="game-menu" aria-labelledby="repair-title">
        <header><h2 id="repair-title">Repair shelter</h2><button type="button" data-close>Close</button></header>
        <div id="repair-materials"></div><p id="repair-error" role="status"></p><button id="shelter-repair" type="button">Repair</button>
      </dialog>
      <dialog id="travel-dialog" class="game-menu" aria-labelledby="travel-title">
        <header><h2 id="travel-title">Travel</h2><button type="button" data-close>Close</button></header>
        <div id="travel-destinations"></div>
      </dialog>
      <dialog id="options-dialog" aria-labelledby="options-title">
        <header class="options-header"><h1 id="options-title">Options</h1><button id="options-close" type="button" aria-label="Close options">Close</button></header>
        <div class="options-content"><div id="graphics-settings"></div></div>
        <footer class="options-footer"><button id="options-reset" type="button">Reset defaults</button></footer>
      </dialog>
    </div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
